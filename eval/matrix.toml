# Sequential views (view_spacing = 0): the next view starts only when the
# previous broadcast delivered without a decision. No work on views that
# never get used when the leader is honest, a whole view of latency when
# it is not.

[[experiment]]
name = "ic-wxsd-seq"
protocol = "ic"
broadcast = "wxsd"
view_spacing = 0
sizes = [[8, 2], [16, 4], [32, 16]]

