# The experiment matrix for eval/run.py. Every experiment runs each of its
# sizes `reps` times, either with one process per node on this host (mode
# "net", all nodes honest) or in the simulator with Byzantine nodes (mode
# "sim": `byzantine` of them, default t, playing `adversary`: silent,
# selective or mixed). Results go to <out>/<name>/n<n>-t<t>/rep<k>/.

[defaults]
round_ms = 500
reps = 3
start_in_s = 3
base_port = 7000
max_rounds = 400

[[experiment]]
name = "ic-ds"
protocol = "ic"
broadcast = "dolev-strong"
sizes = [[8, 2], [16, 4], [32, 16]]

[[experiment]]
name = "ic-wxsd"
protocol = "ic"
broadcast = "wxsd"
sizes = [[8, 2], [16, 4], [32, 16]]

[[experiment]]
name = "parallel-ds"
protocol = "parallel"
broadcast = "dolev-strong"
sizes = [[8, 2], [16, 4], [32, 16]]

[[experiment]]
name = "parallel-wxsd"
protocol = "parallel"
broadcast = "wxsd"
sizes = [[8, 2], [16, 4]]

# Under attack: t Byzantine nodes, silent or delivering to random subsets.

[[experiment]]
name = "ic-ds-attack"
mode = "sim"
adversary = "mixed"
protocol = "ic"
broadcast = "dolev-strong"
sizes = [[8, 2], [16, 4], [32, 16]]

[[experiment]]
name = "ic-wxsd-attack"
mode = "sim"
adversary = "mixed"
protocol = "ic"
broadcast = "wxsd"
sizes = [[8, 2], [16, 4], [32, 16]]

[[experiment]]
name = "parallel-ds-attack"
mode = "sim"
adversary = "mixed"
protocol = "parallel"
broadcast = "dolev-strong"
sizes = [[8, 2], [16, 4], [32, 16]]

[[experiment]]
name = "parallel-wxsd-attack"
mode = "sim"
adversary = "mixed"
protocol = "parallel"
broadcast = "wxsd"
sizes = [[8, 2], [16, 4]]

# Dolev-Strong under its own attack: equivocating senders, chains extended
# and forged, fresh values fabricated; costs verifications and bytes.

[[experiment]]
name = "ic-ds-chaos"
mode = "sim"
adversary = "ds-chaos"
protocol = "ic"
broadcast = "dolev-strong"
sizes = [[8, 2], [16, 4], [32, 16]]

[[experiment]]
name = "parallel-ds-chaos"
mode = "sim"
adversary = "ds-chaos"
protocol = "parallel"
broadcast = "dolev-strong"
sizes = [[8, 2], [16, 4], [32, 16]]
